name: VPS production diagnostics

on:
  workflow_call:
    inputs:
      notify_admin:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      notify_admin:
        description: Send a real Telegram diagnostic button to the primary administrator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avito-radar-vps-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Prepare read-only production checks
        env:
          DIAGNOSTICS_NOTIFY_ADMIN: ${{ inputs.notify_admin && '1' || '' }}
        run: |
          {
            echo "sudo -E bash -s <<'AVITO_DIAGNOSTICS'"
            echo "export DIAGNOSTICS_NOTIFY_ADMIN='${DIAGNOSTICS_NOTIFY_ADMIN}'"
            cat tools/diagnose.sh
            echo ""
            echo "AVITO_DIAGNOSTICS"
          } > .diagnostics-remote.sh

      - name: Check service, resources, SQLite, Avito and Telegram
        run: |
          ssh -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            ibssh_uxq4swo77vsikf7akpeenu53ue@ssh.instabox.sh < .diagnostics-remote.sh
