name: CI/CD Pipeline & Automated Deploy

on:
  push:
    branches:
      - main
      - feature/json-api
  pull_request:
    branches:
      - main
      - feature/json-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avito-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Offline regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check all Python sources without starting the bot
        run: python -B tools/check_syntax.py

      - name: Validate deploy script syntax
        run: bash -n tools/deploy.sh

      - name: Run isolated offline regression suite
        env:
          AVITO_RADAR_TESTING: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout 180 python -B tools/run_offline_tests.py

  deploy:
    name: Deploy tested commit to VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/feature/json-api' || github.ref == 'refs/heads/main')
    concurrency:
      group: avito-radar-vps-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout tested deploy script
        uses: actions/checkout@v4

      - name: Wrap remote script in Bash regardless of the SSH login shell
        run: |
          printf "bash -s <<'AVITO_DEPLOY_SCRIPT'\n" > .deploy-remote.sh
          cat tools/deploy.sh >> .deploy-remote.sh
          printf "\nAVITO_DEPLOY_SCRIPT\n" >> .deploy-remote.sh

      - name: SSH and deploy exact tested SHA
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 18m
          envs: DEPLOY_SHA,DEPLOY_BRANCH
          script_path: .deploy-remote.sh

