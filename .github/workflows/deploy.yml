name: CI/CD Pipeline & Automated Deploy

on:
  push:
    branches:
      - main
      - feature/json-api
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Automated Tests & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code syntax & compilation
        run: |
          python -m py_compile config.py database.py middlewares.py parser.py scheduler.py logger_setup.py bot.py handlers/*.py

      - name: Run Unit Tests Suite
        env:
          BOT_TOKEN: "1234567890:MOCK_TOKEN_FOR_CI_CD"
          ADMIN_ID: "986832959"
          ADMIN_IDS: "986832959,455386428"
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  deploy:
    name: 🚀 Automated Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/json-api' || github.ref == 'refs/heads/main'
    steps:
      - name: SSH and deploy bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Начало автоматического деплоя Avito Radar..."
            TARGET_DIR=""
            if [ -d "/opt/avito_parser_bot" ]; then
              TARGET_DIR="/opt/avito_parser_bot"
            elif [ -d "/opt/avito-bot" ]; then
              TARGET_DIR="/opt/avito-bot"
            fi

            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              git fetch origin feature/json-api
              git reset --hard origin/feature/json-api
              source venv/bin/activate
              pip install --no-cache-dir -r requirements.txt
              systemctl restart avito-bot
              echo "✅ Бот успешно обновлен и перезапущен!"
              systemctl is-active --quiet avito-bot && echo "🟢 Статус сервиса: ACTIVE"
            else
              echo "⚠️ Директория проекта не найдена (/opt/avito_parser_bot или /opt/avito-bot)!"
              exit 1
            fi

