name: CI/CD Pipeline & Automated Deploy

on:
  push:
    branches:
      - main
      - feature/json-api
  pull_request:
    branches:
      - main
      - feature/json-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avito-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Offline regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check all Python sources without starting the bot
        run: python -B tools/check_syntax.py

      - name: Validate deploy script syntax
        run: |
          bash -n tools/deploy.sh
          bash -n tools/diagnose.sh

      - name: Run isolated offline regression suite
        env:
          AVITO_RADAR_TESTING: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout 180 python -B tools/run_offline_tests.py

  deploy:
    name: Deploy tested commit to VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/feature/json-api' || github.ref == 'refs/heads/main')
    concurrency:
      group: avito-radar-vps-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout tested deploy script
        uses: actions/checkout@v4

      - name: Migrate database and stop old VPS if needed
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 3m
          script: |
            systemctl stop avito-bot 2>/dev/null || true
            systemctl disable avito-bot 2>/dev/null || true
            if [ -f /opt/avito_parser_bot/bot_database.db ]; then
              ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ibssh_uxq4swo77vsikf7akpeenu53ue@ssh.instabox.sh \
                "sudo bash -c 'if [ ! -f /opt/avito_parser_bot/bot_database.db ]; then cat > /opt/avito_parser_bot/bot_database.db && echo DB_MIGRATED_FROM_OLD_VPS; fi'" \
                < /opt/avito_parser_bot/bot_database.db || true
            fi
            if [ -f /opt/avito_parser_bot/.env ]; then
              ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ibssh_uxq4swo77vsikf7akpeenu53ue@ssh.instabox.sh \
                "sudo bash -c 'cat > /opt/avito_parser_bot/.env && chmod 600 /opt/avito_parser_bot/.env && echo ENV_MIGRATED_FROM_OLD_VPS'" \
                < /opt/avito_parser_bot/.env || true
            fi

      - name: Wrap remote script in Bash regardless of the SSH login shell
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_FULL_TESTS: ${{ vars.DEPLOY_FULL_TESTS || '0' }}
          DEPLOY_STOP_BEFORE_PREFLIGHT: ${{ vars.DEPLOY_STOP_BEFORE_PREFLIGHT || '0' }}
          DEPLOY_STARS_PAYMENTS_ENABLED: ${{ secrets.STARS_PAYMENTS_ENABLED || vars.STARS_PAYMENTS_ENABLED || '1' }}
          DEPLOY_STARS_PRICE_STANDART: ${{ secrets.STARS_PRICE_STANDART || vars.STARS_PRICE_STANDART || '170' }}
          DEPLOY_STARS_PRICE_PRO: ${{ secrets.STARS_PRICE_PRO || vars.STARS_PRICE_PRO || '470' }}
          DEPLOY_CLEANUP: ${{ vars.DEPLOY_CLEANUP || '1' }}
          DEPLOY_KEEP_RELEASES: ${{ vars.DEPLOY_KEEP_RELEASES || '2' }}
          DEPLOY_KEEP_BACKUPS: ${{ vars.DEPLOY_KEEP_BACKUPS || '3' }}
          DEPLOY_RELEASE_MIN_AGE_DAYS: ${{ vars.DEPLOY_RELEASE_MIN_AGE_DAYS || '1' }}
          DEPLOY_BACKUP_MIN_AGE_DAYS: ${{ vars.DEPLOY_BACKUP_MIN_AGE_DAYS || '2' }}
        run: |
          {
            echo "sudo -E bash -s <<'AVITO_DEPLOY_SCRIPT'"
            echo "export DEPLOY_SHA='${DEPLOY_SHA}'"
            echo "export DEPLOY_BRANCH='${DEPLOY_BRANCH}'"
            echo "export DEPLOY_FULL_TESTS='${DEPLOY_FULL_TESTS}'"
            echo "export DEPLOY_STOP_BEFORE_PREFLIGHT='${DEPLOY_STOP_BEFORE_PREFLIGHT}'"
            echo "export DEPLOY_STARS_PAYMENTS_ENABLED='${DEPLOY_STARS_PAYMENTS_ENABLED}'"
            echo "export DEPLOY_STARS_PRICE_STANDART='${DEPLOY_STARS_PRICE_STANDART}'"
            echo "export DEPLOY_STARS_PRICE_PRO='${DEPLOY_STARS_PRICE_PRO}'"
            echo "export DEPLOY_CLEANUP='${DEPLOY_CLEANUP}'"
            echo "export DEPLOY_KEEP_RELEASES='${DEPLOY_KEEP_RELEASES}'"
            echo "export DEPLOY_KEEP_BACKUPS='${DEPLOY_KEEP_BACKUPS}'"
            echo "export DEPLOY_RELEASE_MIN_AGE_DAYS='${DEPLOY_RELEASE_MIN_AGE_DAYS}'"
            echo "export DEPLOY_BACKUP_MIN_AGE_DAYS='${DEPLOY_BACKUP_MIN_AGE_DAYS}'"
            cat tools/deploy.sh
            echo ""
            echo "AVITO_DEPLOY_SCRIPT"
          } > .deploy-remote.sh

      - name: SSH and deploy exact tested SHA to Instabox VPS
        run: |
          ssh -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            ibssh_uxq4swo77vsikf7akpeenu53ue@ssh.instabox.sh < .deploy-remote.sh

  diagnostics:
    name: Check installed bot and production resources
    needs: deploy
    if: vars.PRODUCTION_DIAGNOSTICS == '1'
    uses: ./.github/workflows/diagnostics.yml
    with:
      notify_admin: ${{ vars.DIAGNOSTICS_NOTIFY_ADMIN == '1' }}
    secrets: inherit

