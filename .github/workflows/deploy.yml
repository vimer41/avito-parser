name: Deploy to VPS

on:
  push:
    branches:
      - main
      - feature/json-api
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Начало автоматического деплоя Avito Radar..."
            TARGET_DIR=""
            if [ -d "/opt/avito_parser_bot" ]; then
              TARGET_DIR="/opt/avito_parser_bot"
            elif [ -d "/opt/avito-bot" ]; then
              TARGET_DIR="/opt/avito-bot"
            fi

            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              git fetch origin feature/json-api
              git reset --hard origin/feature/json-api
              source venv/bin/activate
              pip install --no-cache-dir -r requirements.txt
              systemctl restart avito-bot
              echo "✅ Бот успешно обновлен и перезапущен!"
              systemctl status avito-bot --no-pager -n 5
            else
              echo "⚠️ Директория проекта не найдена (/opt/avito_parser_bot или /opt/avito-bot)!"
              exit 1
            fi
